  @font-face { font-family: "Newsreader"; font-style: normal; font-weight: 200 800; font-display: swap;

  @font-face { font-family: "Instrument Sans"; font-style: normal; font-weight: 400 700; font-display: swap;

  :root { --paper: #f5f2ec; --card: #fbfaf7; --ink: #1b2630; --muted: #5f6a74; --accent: #a3412a; color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font: 400 1.0625rem/1.6 "Instrument Sans", Arial, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 80px 16px; }
  h1 { font: 450 clamp(2.4rem, 8vw, 3.6rem)/1.1 "Newsreader", Georgia, serif; letter-spacing: -0.02em; margin-bottom: 14px; }
  p { color: var(--muted); margin-bottom: 26px; }
  .cta { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { display: inline-flex; align-items: center; min-height: 48px; padding: 12px 20px; border-radius: 8px;
    font-weight: 600; text-decoration: none; border: 1.5px solid var(--ink); color: var(--ink); }
  .btn:hover { background: var(--card); }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: #2e3d4a; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
